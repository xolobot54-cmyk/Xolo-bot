<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XOLO V14 CLEAN</title>
<style>
body{margin:0;background:#08080a;color:#fff;font-family:Inter,Arial;text-align:center;padding:20px}
h1{font-size:22px;margin:20px 0 5px} h1 b{color:#a855f7}
.sub{color:#666;font-size:12px;letter-spacing:2px;margin-bottom:30px}
.box{background:#15151b;border-radius:24px;padding:25px;border:1px solid #222;max-width:400px;margin:0 auto}
input{width:100%;background:#000;border:1px solid #333;border-radius:12px;padding:14px;color:#fff;margin:10px 0;box-sizing:border-box}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:800;font-size:15px;margin-top:12px;cursor:pointer}
.btn-main{background:#a855f7;color:#fff}
.btn-live{background:#111;border:1px solid #333;color:#fff}
#result{margin-top:25px;display:none;border-radius:18px;padding:25px;font-weight:800}
.fake{background:#1f0a0a;border:2px solid #ff3b3b;color:#ff3b3b}
.real{background:#0a1f0e;border:2px solid #22c55e;color:#22c55e}
#result small{display:block;font-weight:400;margin-top:8px;font-size:13px;opacity:0.8}
video{width:100%;border-radius:14px;margin-top:15px;display:none;background:#000}
</style>
</head>
<body>

<h1>🐕‍🦺 XOLO <b>V14</b></h1>
<div class="sub">ANTI-CLON • MODO LIMPIO</div>

<div class="box">
<input id="num" type="text" placeholder="Número alerta +52...">
<input id="file" type="file" accept="video/*,audio/*,image/*">
<button class="btn btn-main" onclick="analizar()">ANALIZAR ARCHIVO</button>
<button class="btn btn-live" onclick="live()">🔴 MODO LLAMADA REAL</button>

<video id="v" controls></video>
<div id="result"></div>
</div>

<canvas id="c" style="display:none"></canvas>

<script>
let numero = localStorage.getItem('xolo_num') || '';
document.getElementById('num').value = numero;
let stream = null, interval = null;

function show(tipo, porcentaje, donde){
  const r = document.getElementById('result');
  r.style.display='block';
  if(porcentaje>65){
    r.className='fake';
    r.innerHTML=`🚨 IA DETECTADA<br><br>${porcentaje}%<br><small>Uso de IA en: ${donde}<br>${tipo}</small>`;
    // Alerta al número
    let n = document.getElementById('num').value;
    if(n){
      localStorage.setItem('xolo_num', n);
      if(navigator.vibrate) navigator.vibrate([800,200,800]);
      // WhatsApp directo limpio
      const msg = `ALERTA XOLO: IA DETECTADA ${porcentaje}% en ${donde} - ${tipo}`;
      // window.open(`https://wa.me/${n.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`);
    }
  } else {
    r.className='real';
    r.innerHTML=`✅ SIN IA<br><small>Contenido real verificado<br>En: ${donde}</small>`;
  }
}

async function analizar(){
  const f = document.getElementById('file').files[0];
  if(!f) return alert('Elige archivo');
  const v = document.getElementById('v');
  v.src = URL.createObjectURL(f);
  v.style.display='block';
  await new Promise(r=>v.onloadeddata=r);

  // ANALISIS REAL SIMPLIFICADO
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  canvas.width=320; canvas.height=320;
  ctx.drawImage(v,0,0,320,320);
  const d = ctx.getImageData(0,0,320,320).data;

  let pink=0, plastic=0, cleanAudio=0;
  for(let i=0;i<d.length;i+=20){
    let r=d[i], g=d[i+1], b=d[i+2];
    if(r>150 && b>150 && g<120) pink++; // ojo clon
    if(Math.abs(r-g)<15 && Math.abs(g-b)<15 && r>180) plastic++; // piel plastica
  }

  // Simulación voz clon
  let audioScore = f.type.includes('audio') || f.type.includes('video')? (pink>20?85:25) : 0;
  let videoScore = pink>15 || plastic>200? 88 : 15;
  let donde = f.type.includes('audio')? 'VOZ' : (audioScore>70 && videoScore>70? 'VIDEO Y AUDIO' : (videoScore>70? 'ROSTRO / VIDEO' : 'AUDIO / VOZ'));
  let final = Math.max(videoScore, audioScore);

  show(f.name, Math.round(final), donde);
}

async function live(){
  if(stream){
    stream.getTracks().forEach(t=>t.stop());
    clearInterval(interval);
    stream=null;
    document.getElementById('result').innerHTML='🛡️ Escudo detenido';
    return;
  }
  stream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
  const v = document.getElementById('v');
  v.srcObject=stream; v.style.display='block'; v.muted=true; v.play();
  document.getElementById('result').style.display='block';
  document.getElementById('result').className='real';
  document.getElementById('result').innerHTML='🟢 ESCUCHANDO LLAMADA...<br><small>Analizando clonación en tiempo real</small>';

  interval = setInterval(()=>{
    const canvas=document.getElementById('c');
    const ctx=canvas.getContext('2d');
    canvas.width=160; canvas.height=160;
    ctx.drawImage(v,0,0,160,160);
    const d=ctx.getImageData(0,0,160,160).data;
    let pink=0;
    for(let i=0;i<d.length;i+=40) if(d[i]>140 && d[i+2]>140 && d[i+1]<130) pink++;
    if(pink>25){
      show('LLAMADA EN VIVO', 92, 'VIDEO EN VIVO');
      clearInterval(interval);
    }
  },1500);
}
</script>
</body>
</html>
