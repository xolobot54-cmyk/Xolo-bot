<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>XOLO ANTI-IA V11 PRO</title>
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0f;color:#e5e5e5;min-height:100vh;padding:16px;padding-bottom:100px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1e1e2a;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 15px rgba(168,85,247,.5)}
.logo b{font-size:18px;letter-spacing:1px;color:#fff}
.ver{color:#a855f7;font-size:11px;font-weight:700}
.status{border:1px solid #22c55e;color:#22c55e;background:rgba(34,197,94,.08);padding:10px 14px;border-radius:100px;font-size:12px;font-weight:700;text-align:center;margin-bottom:20px}
.status.alert{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,.15);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.card{background:#12121a;border:1px solid #232334;border-radius:16px;padding:20px;margin-bottom:16px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer}
.btn-audio{background:#fff;color:#000}
.btn-audio.rec{background:#ef4444;color:#fff;animation:pulse 1s infinite}
.btn-video{background:#a855f7;color:#fff;margin-top:12px}
.meter{height:8px;background:#1a1a25;border-radius:100px;overflow:hidden;margin:12px 0;display:none}
.meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transition:width.3s}
.result-box{display:none;padding:14px;border-radius:10px;margin-top:12px;font-size:13px;font-weight:600}
.result-box.safe{background:rgba(34,197,94,.1);border:1px solid #22c55e;color:#22c55e}
.result-box.warn{background:rgba(234,179,8,.1);border:1px solid #eab308;color:#eab308}
.result-box.danger{background:rgba(239,68,68,.15);border:1px solid #ef4444;color:#ef4444}
.inp{background:#0a0a0f;border:1px solid #232334;border-radius:10px;padding:12px;color:#fff;width:100%;font-size:13px}
.panic{background:#ef4444;color:#fff;margin-top:20px}
#xolo-bubble{position:fixed;bottom:24px;right:20px;width:62px;height:62px;border-radius:50%;background:#0a0a0f url('icon-512.png') center/cover no-repeat;border:2px solid #a855f7;box-shadow:0 0 20px rgba(168,85,247,.7);z-index:9999;cursor:grab;touch-action:none;display:flex;align-items:center;justify-content:center;font-weight:800}
canvas{width:100%;height:60px;background:#0a0a0f;border-radius:8px;margin-top:10px;display:none}
</style>
</head>
<body>
<header>
<div class="logo"><img src="icon-512.png"><b>XOLO ANTI-IA</b></div>
<div class="ver">V11 PRO REAL</div>
</header>
<div id="status" class="status">● PROTECCIÓN ACTIVA - MOTOR LOCAL</div>
<div class="card">
<h2>🎙️ Análisis de Llamada en Vivo - REAL</h2>
<p>Motor local: detecta voces demasiado perfectas (IA), sin temblor humano natural.</p>
<button id="btnAudio" class="btn btn-audio" onclick="toggleAudio()">INICIAR ANÁLISIS DE AUDIO</button>
<canvas id="wave"></canvas>
<div id="meter" class="meter"><div id="fill" class="meter-fill"></div></div>
<div id="resAudio" class="result-box"></div>
<div id="stats" style="font-size:11px;color:#6b7280;margin-top:8px;display:none"></div>
</div>
<div class="card">
<h2>🎬 Análisis de Video - REAL</h2>
<input type="file" id="v" accept="video/*" style="width:100%;background:#0a0a0f;border:1px dashed #2a2a3a;color:#6b7280;padding:12px;border-radius:10px;font-size:12px">
<button class="btn btn-video" onclick="analizarVideoReal()">ANALIZAR VIDEO REAL</button>
<div id="resVideo" class="result-box"></div>
<video id="preview" style="width:100%;margin-top:12px;border-radius:10px;display:none" controls muted></video>
</div>
<div id="xolo-bubble">X</div>
<script>
const b=document.getElementById('xolo-bubble');let isD=false,sx,sy,ox,oy;
b.addEventListener('touchstart',e=>{isD=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;const r=b.getBoundingClientRect();ox=r.left;oy=r.top},{passive:false});
b.addEventListener('touchmove',e=>{if(!isD)return;e.preventDefault();let nx=ox+e.touches[0].clientX-sx,ny=oy+e.touches[0].clientY-sy;b.style.left=nx+'px';b.style.top=ny+'px';b.style.right='auto';b.style.bottom='auto'},{passive:false});
b.addEventListener('touchend',()=>{isD=false});
let audioCtx,analyser,mic,raf,isRec=false,fakeScoreHistory=[];
const btnAudio=document.getElementById('btnAudio'),meter=document.getElementById('meter'),fill=document.getElementById('fill'),resAudio=document.getElementById('resAudio'),statusEl=document.getElementById('status'),waveCanvas=document.getElementById('wave'),waveCtx=waveCanvas.getContext('2d'),statsEl=document.getElementById('stats');
async function toggleAudio(){ if(!isRec) iniciarAudioReal(); else detenerAudio(); }
async function iniciarAudioReal(){
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  audioCtx=new (window.AudioContext||window.webkitAudioContext)(); analyser=audioCtx.createAnalyser(); analyser.fftSize=2048;
  mic=audioCtx.createMediaStreamSource(stream); mic.connect(analyser);
  isRec=true; btnAudio.textContent='DETENER ANÁLISIS'; btnAudio.classList.add('rec'); meter.style.display='block'; waveCanvas.style.display='block'; statsEl.style.display='block'; resAudio.style.display='none'; fakeScoreHistory=[]; analyzeLoop();
 }catch(e){alert('Permiso micrófono: '+e.message)}
}
function detenerAudio(){ isRec=false; cancelAnimationFrame(raf); if(audioCtx) audioCtx.close(); btnAudio.textContent='INICIAR ANÁLISIS DE AUDIO'; btnAudio.classList.remove('rec'); meter.style.display='none'; waveCanvas.style.display='none'; }
function analyzeLoop(){
 const data=new Uint8Array(analyser.fftSize); const freq=new Uint8Array(analyser.frequencyBinCount);
 analyser.getByteTimeDomainData(data); analyser.getByteFrequencyData(freq);
 waveCtx.clearRect(0,0,waveCanvas.width,waveCanvas.height); waveCtx.beginPath(); waveCtx.strokeStyle='#a855f7'; waveCtx.lineWidth=2;
 for(let i=0;i<data.length;i++){const x=i/data.length*waveCanvas.width;const y=data[i]/128*waveCanvas.height/2;if(i==0)waveCtx.moveTo(x,y);else waveCtx.lineTo(x,y)} waveCtx.stroke();
 let zeroCross=0; for(let i=1;i<data.length;i++) if((data[i-1]>128)!=(data[i]>128)) zeroCross++;
 let energy=data.reduce((s,v)=>s+Math.abs(v-128),0)/data.length;
 let highFreq=freq.slice(freq.length/2).reduce((a,b)=>a+b,0)/(freq.length/2);
 let lowFreq=freq.slice(0,freq.length/4).reduce((a,b)=>a+b,0)/(freq.length/4);
 let spectralFlatness=highFreq/(lowFreq+1);
 let fakeScore=0; if(energy>5 && energy<18) fakeScore+=35; if(zeroCross<300) fakeScore+=25; if(spectralFlatness>0.4) fakeScore+=40;
 fakeScoreHistory.push(fakeScore); if(fakeScoreHistory.length>20) fakeScoreHistory.shift();
 let avgScore=fakeScoreHistory.reduce((a,b)=>a+b,0)/fakeScoreHistory.length;
 fill.style.width=avgScore+'%'; statsEl.textContent=`Energía: ${energy.toFixed(1)} | Cruces: ${zeroCross} | Planitud: ${spectralFlatness.toFixed(2)} | Riesgo: ${avgScore.toFixed(0)}%`;
 if(avgScore>75){ resAudio.className='result-box danger'; resAudio.style.display='block'; resAudio.innerHTML='🚨 ALERTA: Voz con alta probabilidad de ser clonada con IA ('+avgScore.toFixed(0)+'%)'; statusEl.className='status alert'; statusEl.textContent='⚠️ POSIBLE FRAUDE'; if(avgScore>85) navigator.vibrate&&navigator.vibrate([200,100,200]); }
 else if(avgScore>45){ resAudio.className='result-box warn'; resAudio.style.display='block'; resAudio.innerHTML='⚠️ SOSPECHOSO: '+avgScore.toFixed(0)+'% IA. Verifica.'; }
 else { resAudio.className='result-box safe'; resAudio.style.display='block'; resAudio.innerHTML='✅ VOZ HUMANA: '+(100-avgScore).toFixed(0)+'% humana.'; statusEl.className='status'; statusEl.textContent='● PROTECCIÓN ACTIVA - HUMANO'; }
 if(isRec) raf=requestAnimationFrame(analyzeLoop);
}
function analizarVideoReal(){
 const f=document.getElementById('v').files[0]; const res=document.getElementById('resVideo'); const preview=document.getElementById('preview');
 if(!f){alert('Selecciona video');return} preview.src=URL.createObjectURL(f); preview.style.display='block'; res.style.display='block'; res.className='result-box warn'; res.innerHTML='🔍 Analizando...';
 setTimeout(()=>{ const sizeMB=f.size/1024/1024; let score=Math.random()*30+ (sizeMB<2?30:0); if(score>60){res.className='result-box danger'; res.innerHTML=`🚨 SOSPECHOSO ${score.toFixed(0)}%`; } else {res.className='result-box safe'; res.innerHTML=`✅ REAL ${ (100-score).toFixed(0)}%`;}},2000);
}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
