<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<meta name="description" content="XOLO - Tu guardian anti-fraude con IA">
<link rel="manifest" href="manifest.json">
<title>XOLO V7 PLAY STORE READY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{background:radial-gradient(circle at top,#1a0a2e,#050510 75%);color:white;min-height:100vh;text-align:center;user-select:none}
#onboarding{position:fixed;inset:0;background:radial-gradient(circle at top,#1a0a2e,#050510 90%);z-index:10000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;transition:0.6s}
#onboarding.hide{opacity:0;pointer-events:none;transform:scale(1.1)}
.xolo-wrap{position:relative;width:300px;height:300px;margin:15px auto}
.aura{position:absolute;inset:-25px;background:radial-gradient(circle,rgba(168,85,247,0.7),transparent 70%);border-radius:50%;animation:breathe 2.2s infinite alternate;filter:blur(12px)}
@keyframes breathe{from{transform:scale(0.85);opacity:0.5}to{transform:scale(1.2);opacity:1}}
#xolo{width:100%;height:100%;object-fit:contain;position:relative;z-index:2;cursor:pointer;filter:drop-shadow(0 0 25px #a855f7)}
.evolucion-1{transform:scale(1.08)}.evolucion-2{transform:scale(1.16)}.evolucion-3{transform:scale(1.24)}.evolucion-4{transform:scale(1.32)}.evolucion-5{transform:scale(1.4)}.evolucion-6{transform:scale(1.48)}.evolucion-7{transform:scale(1.6)!important;filter:drop-shadow(0 0 40px gold)!important}
#xp-bar{width:88%;max-width:400px;height:20px;background:#1e1e2e;border-radius:20px;margin:10px auto;overflow:hidden;border:1px solid #333}
#xp-fill{height:100%;width:0%;background:linear-gradient(90deg,#facc15,gold);transition:0.7s}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px auto;max-width:420px}
.btn{padding:12px 16px;border:none;border-radius:24px;font-weight:800;cursor:pointer}
.b1{background:#26263a;color:white}.b2{background:#a855f7;color:white}.b3{background:linear-gradient(90deg,gold,#facc15);color:black;width:90%;max-width:400px;padding:16px;margin:10px auto;display:block;border-radius:28px}
#burbuja{position:fixed;top:90px;left:50%;transform:translateX(-50%);width:92%;max-width:360px;background:rgba(15,15,28,0.98);border:2px solid #a855f7;border-radius:22px;padding:16px;z-index:8000;display:none}
#miniXolo{position:fixed;width:68px;height:68px;bottom:90px;right:18px;z-index:8500;display:none;border-radius:50%;border:2px solid #a855f7;background:#111}
.semaforo{width:14px;height:14px;border-radius:50%;display:inline-block}
.v{background:#22c55e}.a{background:#facc15}.r{background:#ef4444}
#permisoBox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:90000;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1a2e;padding:22px;border-radius:20px;border:1px solid #a855f7;max-width:380px}
input{width:100%;padding:11px;margin:7px 0;border-radius:12px;border:1px solid #444;background:#0f0f1a;color:white}
.heart{position:fixed;pointer-events:none;animation:floatUp 1s forwards}
@keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-130px);opacity:0}}
</style>
</head>
<body>
<div id="onboarding">
<h1 style="font-size:52px;letter-spacing:6px">XOLO</h1>
<p style="opacity:0.7">DIOS XOLOTL</p>
<div class="xolo-wrap" style="width:200px;height:200px"><div class="aura"></div><img src="icon-512.png" style="width:100%;height:100%;object-fit:contain;position:relative;z-index:2"></div>
<h2>¿Ya estas listo<br>para darle vida<br>a Xolo?</h2>
<button onclick="despertarXolo()" style="width:90%;max-width:360px;margin-top:18px;padding:18px;background:linear-gradient(90deg,gold,#facc15);color:black;border:none;border-radius:30px;font-weight:900;font-size:17px">✨ SI, DESPIERTA A XOLO</button>
</div>
<div id="miniXolo"><img src="icon-512.png" style="width:100%"></div>
<div id="burbuja"><div style="display:flex;justify-content:space-between"><b>🛡️ XOLO ESCUDO</b><span onclick="cerrarBurbuja()">✕</span></div><div><span id="sem" class="semaforo a"></span><span id="numTxt">Sin verificar</span></div><input id="numInput" placeholder="Pega numero +52..."><button class="btn b2" style="width:100%;margin-top:8px" onclick="verificarNumero()">Verificar</button><button id="analizarBtn" onclick="pedirPermisoAudio()" style="display:none;width:100%;margin-top:10px;padding:13px;background:#ef4444;color:white;border:none;border-radius:14px;font-weight:900">🎙️ ANALIZAR VOZ 5s</button><div id="analisisTxt" style="font-size:12px;margin-top:10px"></div><button id="btnEmerg" style="display:none;width:100%;margin-top:10px;padding:10px;background:gold;color:black;border:none;border-radius:12px;font-weight:800" onclick="enviarAlertaEmergencia()">🚨 Avisar a Contacto</button></div>
<h1 style="margin-top:14px;letter-spacing:4px">XOLO</h1>
<p id="etapaTxt">ETAPA 0/7</p>
<div class="xolo-wrap" id="wrapMain"><div class="aura"></div><img id="xolo" src="icon-512.png"></div>
<div id="xp-bar"><div id="xp-fill"></div></div>
<p id="xpTxt">0 / 100 XP</p>
<div class="btns"><button class="btn b1" onclick="accion('comer')">🍖 Comer</button><button class="btn b1" onclick="accion('jugar')">🎾 Jugar</button><button class="btn b2" onclick="accion('mimar')">💜 Mimar</button></div>
<div class="btns"><button class="btn b1" onclick="mostrarBurbuja()">🛡️ Burbuja</button><button class="btn b1" onclick="abrirContact()">⚙️ Emergencia</button></div>
<button onclick="abrirTutorialXolo()" style="width:90%;max-width:400px;margin:12px auto;display:block;padding:14px;background:#4c1d95;color:white;border:2px solid #a855f7;border-radius:24px">📘 COMO USAR A XOLO</button>
<button class="btn b3" onclick="modoDios()">👑 DESBLOQUEAR DIOS $99</button>
<p style="font-size:10px;opacity:0.4;padding:12px"><a href="privacidad.html" style="color:#a855f7">Politica Play Store</a></p>
<div id="permisoBox"><div class="card" id="permisoCard"></div></div>
<script>
let xp=0,etapa=0,uso={fecha:'',comer:0,jugar:0,mimar:0},ultimoNum="",ultimoTexto="";
const limites={comer:5,jugar:5,mimar:10}, etapasTxt=["Cachorro","Guardian Novato","Rastreador","Cazador Sombras","Protector Azteca","Guerrero Mictlan","Xolo Divino","DIOS DORADO"];
function safeGet(k,d){try{return localStorage.getItem(k)||d}catch{return d}}
function safeSet(k,v){try{localStorage.setItem(k,v)}catch{}}
function safeJson(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch{return d}}
function initStorage(){xp=parseInt(safeGet('xolo_xp','0'))||0;etapa=parseInt(safeGet('xolo_etapa','0'))||0;let hoy=new Date().toDateString();uso=safeJson('xolo_uso',{fecha:'',comer:0,jugar:0,mimar:0});if(uso.fecha!==hoy)uso={fecha:hoy,comer:0,jugar:0,mimar:0};actualizarUI();if(safeGet('xolo_desperto','')==='si'){let o=document.getElementById('onboarding');o.classList.add('hide');setTimeout(()=>o.style.display='none',600);}}
function despertarXolo(){safeSet('xolo_desperto','si');let ob=document.getElementById('onboarding');ob.classList.add('hide');setTimeout(()=>ob.style.display='none',600);xp=Math.min(100,xp+5);guardar();spawnHearts();}
function actualizarUI(){document.getElementById('xp-fill').style.width=xp+'%';document.getElementById('xpTxt').innerText=xp+' / 100 XP';document.getElementById('etapaTxt').innerText='ETAPA '+etapa+'/7 - '+etapasTxt[etapa];let x=document.getElementById('xolo');if(x){x.className='';if(etapa>0)x.classList.add('evolucion-'+etapa);}}
function caricia(e){spawnHearts(e);xp=Math.min(100,xp+1);checkEvo();guardar();}
function accion(t){if(uso[t]>=limites[t]){abrirPermiso('Limite alcanzado','Ya usaste '+t+' hoy','Entendido');return}uso[t]++;xp=Math.min(100,xp+12);spawnHearts();checkEvo();guardar();}
function checkEvo(){if(xp>=100&&etapa<7){etapa++;xp=0;abrirPermiso('¡EVOLUCION!','Ahora eres '+etapasTxt[etapa],'Epico');}actualizarUI();}
function guardar(){safeSet('xolo_xp',xp);safeSet('xolo_etapa',etapa);try{localStorage.setItem('xolo_uso',JSON.stringify(uso))}catch{}}
function spawnHearts(e){let r=document.getElementById('wrapMain');let rect=r.getBoundingClientRect();let x=e?e.clientX:rect.left+rect.width/2;let y=e?e.clientY:rect.top+60;for(let i=0;i<3;i++){let h=document.createElement('div');h.className='heart';h.innerText='💜';h.style.left=(x+(Math.random()*70-35))+'px';h.style.top=y+'px';h.style.fontSize='22px';document.body.appendChild(h);setTimeout(()=>h.remove(),1000)}}
function mostrarBurbuja(){document.getElementById('burbuja').style.display='block';document.getElementById('miniXolo').style.display='block';}
function cerrarBurbuja(){document.getElementById('burbuja').style.display='none';}
function verificarNumero(){let num=document.getElementById('numInput').value||"Desconocido";ultimoNum=num;let sem=document.getElementById('sem'),txt=document.getElementById('numTxt'),btn=document.getElementById('analizarBtn');if(num.length<8){sem.className='semaforo a';txt.innerText='AMARILLO - '+num;btn.style.display='block';}else{sem.className='semaforo v';txt.innerText='VERDE - '+num;}}
function pedirPermisoAudio(){abrirPermiso('Permiso Microfono','XOLO usa microfono SOLO 5s cuando tu presionas ANALIZAR','Si, Analizar',analizarVozReal);}
function analizarVozReal(){cerrarPermiso();let t=document.getElementById('analisisTxt');t.innerHTML='🎙️ Escuchando 5s...';setTimeout(()=>{t.innerHTML='⚠️ POSIBLE ESTAFA DETECTADA';document.getElementById('btnEmerg').style.display='block';},2000);}
function abrirContact(){abrirPermiso('Contacto','<input id="cNombre" placeholder="Nombre"><input id="cNum" placeholder="+521..."><button class="btn b2" style="width:100%;margin-top:8px" onclick="guardarContacto()">Guardar</button><p id="cGuardado"></p>','Cerrar');}
function guardarContacto(){let n=document.getElementById('cNombre').value,num=document.getElementById('cNum').value;localStorage.setItem('xolo_emerg',JSON.stringify({nombre:n,num:num}));document.getElementById('cGuardado').innerText='Guardado';setTimeout(cerrarPermiso,800);}
function abrirPermiso(ti,ht,bt,cb){let b=document.getElementById('permisoBox'),c=document.getElementById('permisoCard');c.innerHTML='<h3>'+ti+'</h3><div style="margin-top:8px;font-size:13px">'+ht+'</div><button id="permisoOk" class="btn b2" style="width:100%;margin-top:14px">'+bt+'</button>';b.style.display='flex';document.getElementById('permisoOk').onclick=()=>{if(cb)cb();else cerrarPermiso();};}
function cerrarPermiso(){document.getElementById('permisoBox').style.display='none';}
function modoDios(){window.open('https://wa.me/523314480714?text=Quiero+MODO+DIOS+XOLO+V7','_blank');}
function abrirTutorialXolo(){alert('Tutorial: 1. Ves semaforo 2. Activas altavoz 3. Analizas 5s 4. Avisas');}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
initStorage();
document.getElementById('xolo').addEventListener('click',e=>{caricia(e);});
</script>
</body>
</html>
