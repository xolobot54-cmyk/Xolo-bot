<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XOLO V8.4 CENTRADO</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:white;font-family:sans-serif;height:100vh;display:flex}
.sidebar{width:60px;background:#15151f;display:flex;flex-direction:column;align-items:center;padding:15px 0;gap:15px;z-index:100 !important;position:relative}
.sidebar button{width:40px;height:40px;border-radius:12px;border:none}
.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.aura{position:absolute;width:280px;height:280px;background:radial-gradient(circle, rgba(156,39,176,0.4), transparent 70%);border-radius:50%}
#xolo-display{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%}
#xolo-display img{max-width:70% !important;max-height:50vh !important;margin:0 auto !important;display:block !important;object-fit:contain !important}
.etapa{margin-top:15px;background:rgba(255,255,255,0.1);padding:8px 16px;border-radius:20px}
</style>
</head>
<body>
<div class="sidebar">
<button style="background:#ffcc00">🏠</button>
<button style="background:#9c27b0">🐾</button>
<button style="background:#ffcc00">💎</button>
</div>
<div class="main">
<div class="aura"></div>
<div id="xolo-display">
<img src="icon-512.png">
<div class="etapa">ETAPA 7/7 DIOS DORADO</div>
</div>
</div>
</body>
</html>
