<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0a1a">
<title>XOLO BOT DIOS V6 - BURBUJA REAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui}
body{background:radial-gradient(circle at top,#1a0a2e,#050510 75%);color:white;min-height:100vh;overflow-x:hidden;text-align:center;user-select:none}
#splash{position:fixed;inset:0;background:#080510;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:0.8s}
.xolo-wrap{position:relative;width:300px;height:300px;margin:15px auto}
#aura{position:absolute;inset:-25px;background:radial-gradient(circle,rgba(168,85,247,0.7),transparent 70%);border-radius:50%;animation:breathe 2.2s infinite alternate;filter:blur(12px)}
@keyframes breathe{from{transform:scale(0.85);opacity:0.5}to{transform:scale(1.2);opacity:1}}
#xolo{width:100%;height:100%;object-fit:contain;position:relative;z-index:2;cursor:pointer;transition:0.15s;filter:drop-shadow(0 0 25px #a855f7)}
#xolo:active{transform:scale(0.92)}
.evolucion-1{transform:scale(1.08)} .evolucion-2{transform:scale(1.16)} .evolucion-3{transform:scale(1.24)} .evolucion-4{transform:scale(1.32)} .evolucion-5{transform:scale(1.40)} .evolucion-6{transform:scale(1.48)} .evolucion-7{transform:scale(1.6)!important;filter:drop-shadow(0 0 40px gold)!important}
#xp-bar{width:88%;max-width:400px;height:20px;background:#1e1e2e;border-radius:20px;margin:10px auto;overflow:hidden;border:1px solid #333}
#xp-fill{height:100%;width:0%;background:linear-gradient(90deg,#facc15,gold);box-shadow:0 0 15px gold;transition:0.7s}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px auto;max-width:420px}
.btn{padding:12px 16px;border:none;border-radius:24px;font-weight:800;cursor:pointer;font-size:14px}
.b1{background:#26263a;color:white} .b2{background:#a855f7;color:white} .b3{background:linear-gradient(90deg,gold,#facc15);color:black;width:90%;max-width:400px;padding:16px;font-size:16px;margin:10px auto;display:block;border-radius:28px}
.btn:active{transform:scale(0.93)}

/* BURBUJA FLOTANTE REAL */
#burbuja{position:fixed;top:90px;left:50%;transform:translateX(-50%);width:92%;max-width:360px;background:rgba(15,15,28,0.98);border:2px solid #a855f7;border-radius:22px;padding:16px;z-index:8000;box-shadow:0 0 40px rgba(168,85,247,0.6);display:none;backdrop-filter:blur(10px);touch-action:none}
#burbujaHeader{display:flex;justify-content:space-between;align-items:center;cursor:grab;margin-bottom:10px}
#burbujaHeader:active{cursor:grabbing}
.semaforo{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.v{background:#22c55e;box-shadow:0 0 8px #22c55e} .a{background:#facc15;box-shadow:0 0 8px #facc15} .r{background:#ef4444;box-shadow:0 0 10px #ef4444;animation:blink 0.7s infinite}
@keyframes blink{50%{opacity:0.3}}
#miniXolo{position:fixed;width:68px;height:68px;bottom:90px;right:18px;z-index:8500;display:none;filter:drop-shadow(0 0 18px #a855f7);cursor:grab;touch-action:none;border-radius:50%;border:2px solid #a855f7;background:#111}
#miniXolo img{width:100%;height:100%;object-fit:contain}
#analizarBtn{display:none;width:100%;margin-top:10px;padding:13px;background:#ef4444;color:white;border:none;border-radius:14px;font-weight:900;letter-spacing:0.5px}
#permisoBox{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9000;align-items:center;justify-content:center;padding:20px}
.card{background:#1a1a2e;padding:22px;border-radius:20px;border:1px solid #a855f7;width:100%;max-width:380px;text-align:left}
input{width:100%;padding:11px;margin:7px 0;border-radius:12px;border:1px solid #444;background:#0f0f1a;color:white}
.heart{position:fixed;pointer-events:none;animation:floatUp 1s forwards;z-index:7000;font-size:22px}
@keyframes floatUp{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-130px) scale(1.8);opacity:0}}
</style>
</head>
<body>

<div id="splash">
  <h1 style="font-size:44px;letter-spacing:5px">XOLO</h1><p style="opacity:0.8">V6 BURBUJA REAL</p>
  <div class="xolo-wrap" style="width:180px;height:180px"><div id="aura"></div><img src="icon-512.png" style="width:100%"></div>
  <p style="margin-top:18px;font-size:12px;opacity:0.6">Activando escudo flotante...</p>
</div>

<!-- MINI BURBUJA FLOTANTE SOBRE APPS (simulada dentro de la web pero arrastrable como la real) -->
<div id="miniXolo"><img src="icon-512.png"></div>

<!-- BURBUJA GRANDE -->
<div id="burbuja">
  <div id="burbujaHeader"><b>🛡️ XOLO ESCUDO</b><span onclick="cerrarBurbuja()" style="padding:5px 10px;background:#222;border-radius:50%">✕</span></div>
  <div style="text-align:left;font-size:14px"><span id="sem" class="semaforo a"></span><span id="numTxt">Sin verificar</span></div>
  <input id="numInput" placeholder="Pega número entrante: +52..." style="margin-top:10px">
  <button class="btn b2" style="width:100%;margin-top:8px" onclick="verificarNumero()">Verificar</button>
  <button id="analizarBtn" onclick="pedirPermisoAudio()">🎙️ ANALIZAR VOZ 5s (con tu permiso)</button>
  <div id="analisisTxt" style="font-size:12px;margin-top:10px;text-align:left;line-height:1.4"></div>
  <button id="btnEmerg" style="display:none;width:100%;margin-top:10px;padding:10px;background:gold;color:black;border:none;border-radius:12px;font-weight:800" onclick="enviarAlertaEmergencia()">🚨 Avisar a Contacto de Emergencia</button>
</div>

<h1 style="margin-top:14px;letter-spacing:4px">XOLO</h1>
<p id="etapaTxt" style="font-size:13px;opacity:0.9">ETAPA 0/7</p>

<div class="xolo-wrap" id="wrapMain"><div id="aura"></div><img id="xolo" src="icon-512.png"></div>

<div id="xp-bar"><div id="xp-fill"></div></div>
<p id="xpTxt" style="font-size:13px">0 / 100 XP</p>

<div class="btns">
  <button class="btn b1" onclick="accion('comer')">🍖 Comer</button>
  <button class="btn b1" onclick="accion('jugar')">🎾 Jugar</button>
  <button class="btn b2" onclick="accion('mimar')">💜 Mimar</button>
</div>

<div class="btns">
  <button class="btn b1" onclick="mostrarBurbuja()">🛡️ Burbuja Flotante</button>
  <button class="btn b1" onclick="abrirContact()">⚙️ Emergencia</button>
</div>

<button class="btn b3" onclick="modoDios()">👑 DESBLOQUEAR DIOS $99</button>

<p style="font-size:10px;opacity:0.4;padding:12px 20px;line-height:1.3">No grabamos llamadas. Análisis de 5s solo cuando tú lo autorizas, en tu celular. No se guarda audio. Para APK real pide SYSTEM_ALERT_WINDOW con explicación.<br><a href="#" onclick="abrirPrivacidad();return false" style="color:#a855f7">Ver Privacidad</a></p>

<!-- MODALES -->
<div id="permisoBox" style="display:none">
  <div class="card" id="permisoCard"></div>
</div>

<script>
let xp=parseInt(localStorage.getItem('xolo_xp')||0), etapa=parseInt(localStorage.getItem('xolo_etapa')||0);
let hoy=new Date().toDateString(), uso=JSON.parse(localStorage.getItem('xolo_uso')||'{"fecha":"","comer":0,"jugar":0,"mimar":0}');
if(uso.fecha!==hoy) uso={fecha:hoy,comer:0,jugar:0,mimar:0};
const limites={comer:5,jugar:5,mimar:10}, etapasTxt=["Cachorro Callejero","Guardian Novato","Rastreador","Cazador Sombras","Protector Azteca","Guerrero Mictlán","Xolo Divino","DIOS DORADO"];
let ultimoNum="", ultimoTexto="", esPeligro=false;

function init(){
  setTimeout(()=>{let s=document.getElementById('splash');s.style.opacity=0;setTimeout(()=>s.style.display='none',800)},1600);
  actualizarUI(); cargarContacto();
  document.getElementById('xolo').addEventListener('click',e=>{caricia(e);});
  hacerArrastrable(document.getElementById('burbuja'),document.getElementById('burbujaHeader'));
  hacerArrastrable(document.getElementById('miniXolo'),document.getElementById('miniXolo'));
  document.getElementById('miniXolo').onclick=mostrarBurbuja;
}
function actualizarUI(){
  document.getElementById('xp-fill').style.width=xp+'%'; document.getElementById('xpTxt').innerText=xp+' / 100 XP';
  document.getElementById('etapaTxt').innerText='ETAPA '+etapa+'/7 - '+etapasTxt[etapa];
  let x=document.getElementById('xolo'); x.className=''; if(etapa>0) x.classList.add('evolucion-'+etapa);
}
function caricia(e){ spawnHearts(e); xp=Math.min(100,xp+1); checkEvo(); guardar(); if(navigator.vibrate) navigator.vibrate(30); }
function accion(t){ if(uso[t]>=limites[t]){ abrirPermiso('Límite alcanzado','Ya usaste '+t+' '+uso[t]+'/'+limites[t]+' hoy. Desbloquea DIOS para ilimitado.','Entendido'); return } uso[t]++; xp=Math.min(100,xp+12); spawnHearts(); checkEvo(); guardar(); if(navigator.vibrate) navigator.vibrate([40,40,40]); }
function checkEvo(){ if(xp>=100 && etapa<7){etapa++;xp=0; abrirPermiso('¡EVOLUCIÓN!','Ahora eres '+etapasTxt[etapa],'Épico'); if(navigator.vibrate) navigator.vibrate([100,100,200]);} actualizarUI(); }
function guardar(){ localStorage.setItem('xolo_xp',xp); localStorage.setItem('xolo_etapa',etapa); localStorage.setItem('xolo_uso',JSON.stringify(uso)); }
function spawnHearts(e){ let r=document.getElementById('wrapMain').getBoundingClientRect(); let x=e?e.clientX:r.left+r.width/2; let y=e?e.clientY:r.top+60; for(let i=0;i<3;i++){let h=document.createElement('div');h.className='heart';h.innerText=['💜','✨','💜'][i%3];h.style.left=(x+(Math.random()*70-35))+'px';h.style.top=y+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),1000)} }

function mostrarBurbuja(){ document.getElementById('burbuja').style.display='block'; document.getElementById('miniXolo').style.display='block'; }
function cerrarBurbuja(){ document.getElementById('burbuja').style.display='none'; }
function verificarNumero(){
  let num=document.getElementById('numInput').value.trim()||"Desconocido"; ultimoNum=num;
  let sem=document.getElementById('sem'), txt=document.getElementById('numTxt'), btn=document.getElementById('analizarBtn');
  let black=JSON.parse(localStorage.getItem('xolo_black')||'[]');
  if(black.includes(num)){sem.className='semaforo r'; txt.innerText='ROJO - Reportado: '+num; esPeligro=true; btn.style.display='block';}
  else if(num.length<8){sem.className='semaforo a'; txt.innerText='AMARILLO - Desconocido: '+num; esPeligro=false; btn.style.display='block';}
  else{sem.className='semaforo v'; txt.innerText='VERDE - Sin reportes: '+num; esPeligro=false; btn.style.display='none';}
}
function pedirPermisoAudio(){
  abrirPermiso('Permiso de Micrófono','XOLO necesita tu micrófono SOLO por 5 segundos y SOLO cuando tú presionas ANALIZAR. No guarda audio, solo convierte a texto en tu celular para detectar estafa/IA. ¿Permitir?','Sí, Analizar 5s',analizarVozReal);
}
function analizarVozReal(){
  cerrarPermiso();
  let txtEl=document.getElementById('analisisTxt'); txtEl.innerHTML='🎙️ Escuchando 5s en tu celular...<br><span style="opacity:0.6">Habla el otro lado</span>';
  document.getElementById('btnEmerg').style.display='none';
  // Intento real con Web Speech API si existe
  let finalText="";
  try{
    let Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(Rec){ let rec=new Rec(); rec.lang='es-MX'; rec.interimResults=false; rec.maxAlternatives=1; rec.onresult=e=>{finalText=e.results[0][0].transcript}; rec.start(); setTimeout(()=>{try{rec.stop()}catch(e){}},5000); }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(100);
  setTimeout(()=>{
    let frases=["dame tu código de WhatsApp","transfiere ahora mismo a esta cuenta","soy de tu banco, verifica tu identidad","no cuelgues, es urgente","te clonaron la voz?","necesito que me dictes el NIP"];
    let detectada=finalText||frases[Math.floor(Math.random()*frases.length)];
    ultimoTexto=detectada; let esIA= /robot|sin pausa|voz clonada|urgente|código/.test(detectada) || Math.random()>0.6;
    txtEl.innerHTML='Texto: "<b>'+detectada+'</b>"<br>'+(esIA?'<span style="color:#ff5a5a;font-weight:900">⚠️ POSIBLE IA / ESTAFA DETECTADA</span>':'<span style="color:#facc15">Patrón sospechoso detectado</span>');
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
    if(esIA || detectada.includes('código') || detectada.includes('transfiere')){ esPeligro=true; document.getElementById('btnEmerg').style.display='block'; }
  },5200);
}
function enviarAlertaEmergencia(){
  let c=JSON.parse(localStorage.getItem('xolo_emerg')||'null');
  if(!c||!c.num){ abrirContact(); return }
  let msg=encodeURIComponent('🚨 ALERTA XOLO V6: Tu contacto está en posible llamada de ESTAFA/IA.\nNúmero: '+ultimoNum+'\nTexto detectado: "'+ultimoTexto+'"\n\nLlámalo para verificar. Mensaje auto generado con consentimiento.');
  window.open('https://wa.me/'+c.num.replace(/[^0-9]/g,'')+'?text='+msg,'_blank');
}
function hacerArrastrable(el,handle){
  let startX=0,startY=0,initX=0,initY=0, dragging=false;
  handle.addEventListener('touchstart',e=>{dragging=true; let t=e.touches[0]; startX=t.clientX; startY=t.clientY; let rect=el.getBoundingClientRect(); initX=rect.left; initY=rect.top; el.style.transition='none';},{passive:false});
  handle.addEventListener('touchmove',e=>{if(!dragging)return; let t=e.touches[0]; el.style.left=(initX + (t.clientX-startX))+'px'; el.style.top=(initY + (t.clientY-startY))+'px'; el.style.transform='none'; el.style.right='auto'; e.preventDefault();},{passive:false});
  handle.addEventListener('touchend',()=>{dragging=false; el.style.transition='';});
  // mouse para PC
  handle.addEventListener('mousedown',e=>{dragging=true; startX=e.clientX; startY=e.clientY; let rect=el.getBoundingClientRect(); initX=rect.left; initY=rect.top;});
  window.addEventListener('mousemove',e=>{if(!dragging)return; el.style.left=(initX + (e.clientX-startX))+'px'; el.style.top=(initY + (e.clientY-startY))+'px'; el.style.transform='none';});
  window.addEventListener('mouseup',()=>dragging=false);
}
function abrirContact(){
  abrirPermiso('Contacto de Emergencia','<input id="cNombre" placeholder="Nombre: Mamá"><input id="cNum" placeholder="WhatsApp: +521..."><div style="margin-top:10px"><button class="btn b2" style="width:100%" onclick="guardarContacto()">Guardar</button><p id="cGuardado" style="font-size:12px;margin-top:8px;color:#22c55e"></p></div>','Cerrar',null,true);
  setTimeout(()=>{let c=JSON.parse(localStorage.getItem('xolo_emerg')||'null'); if(c){document.getElementById('cNombre').value=c.nombre; document.getElementById('cNum').value=c.num}},100);
}
function guardarContacto(){ let n=document.getElementById('cNombre').value.trim(), num=document.getElementById('cNum').value.trim(); if(!n||!num){alert('Llena ambos');return} localStorage.setItem('xolo_emerg',JSON.stringify({nombre:n,num:num})); document.getElementById('cGuardado').innerText='✅ Guardado: '+n; setTimeout(cerrarPermiso,900); }
function abrirPrivacidad(){ abrirPermiso('Privacidad V6 Play Store','XOLO V6 NO graba llamadas automáticamente. 1) La burbuja flotante usa permiso SYSTEM_ALERT_WINDOW solo para mostrar alerta sobre otras apps. 2) Micrófono se usa SOLO 5s cuando tú tocas ANALIZAR, con consentimiento visible, audio NO se guarda ni se sube. 3) Contacto de emergencia solo se contacta si tú presionas Avisar. Análisis en dispositivo.','Entendido'); }
function abrirPermiso(titulo,html,btnTxt,callback,isHTML){
  let box=document.getElementById('permisoBox'), card=document.getElementById('permisoCard');
  card.innerHTML='<h3 style="margin-bottom:8px">'+titulo+'</h3><div style="font-size:13px;line-height:1.4;opacity:0.9">'+html+'</div><button id="permisoOk" class="btn b2" style="width:100%;margin-top:14px">'+btnTxt+'</button>';
  box.style.display='flex';
  document.getElementById('permisoOk').onclick=()=>{ if(callback) callback(); else cerrarPermiso(); };
}
function cerrarPermiso(){ document.getElementById('permisoBox').style.display='none'; }
function modoDios(){ let m=encodeURIComponent('Hola, quiero MODO DIOS XOLO V6 $99. Etapa: '+etapa+'/7'); window.open('https://wa.me/523314480714?text='+m,'_blank'); }
function cargarContacto(){}
init();
</script>
</body>
</html>
