<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XOLO V8.4 CENTRADO</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0f">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:'Segoe UI',sans-serif;height:100vh;height:100dvh;display:flex;overflow:hidden}
.sidebar{width:62px;background:#15151f;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:12px;z-index:100;position:relative;flex-shrink:0;border-right:1px solid #2a2a3a}
.sidebar button{width:42px;height:42px;border-radius:12px;border:none;font-size:20px;cursor:pointer;transition:0.2s}
.sidebar button:active{transform:scale(0.9)}
.btn-y{background:#ffcc00} .btn-p{background:#9c27b0;color:#fff} .btn-g{background:#222235;color:#fff;border:1px solid #333 !important}
.main{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;overflow:hidden}
.aura{position:absolute;width:300px;height:300px;background:radial-gradient(circle, rgba(156,39,176,0.45) 0%, rgba(255,215,0,0.15) 50%, transparent 75%);border-radius:50%;animation:pulse 2.5s infinite;z-index:1}
@keyframes pulse{0%,100%{transform:scale(1);opacity:0.7}50%{transform:scale(1.2);opacity:1}}
#xolo-display{position:relative;z-index:2;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:12px}
#xolo-img{max-width:68% !important;max-height:48vh !important;width:auto !important;height:auto !important;object-fit:contain !important;display:block !important;margin:0 auto !important;filter:drop-shadow(0 0 25px #ffd700) drop-shadow(0 0 15px #9c27b0);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title{font-size:20px;font-weight:800;letter-spacing:1px;text-shadow:0 0 10px #ffd700}
.etapa-badge{background:linear-gradient(90deg,#222235,#2a2a4a);border:1px solid #ffd70044;padding:8px 18px;border-radius:20px;font-size:13px;letter-spacing:1px}
.stats{position:absolute;bottom:12px;left:12px;right:12px;background:rgba(21,21,31,0.85);backdrop-filter:blur(10px);border:1px solid #2a2a3a;border-radius:16px;padding:12px;display:flex;justify-content:space-around;z-index:50}
.stat{font-size:12px;text-align:center} .stat b{display:block;font-size:16px;color:#ffcc00}
.actions{position:absolute;bottom:85px;display:flex;gap:10px;z-index:50}
.actions button{background:#9c27b0;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:700}
</style>
</head>
<body>
<div class="sidebar">
<button class="btn-y">🏠</button>
<button class="btn-p">🐾</button>
<button class="btn-y">🦴</button>
<button class="btn-p">💎</button>
<button class="btn-g">⚙️</button>
</div>

<div class="main">
<div class="aura"></div>
<div id="xolo-display">
<div class="title">XOLO DIOS DORADO</div>
<img id="xolo-img" src="icon-512.png" onerror="this.src='https://cdn-icons-png.flaticon.com/512/616/616408.png'">
<div class="etapa-badge" id="etapa-text">ETAPA 7/7 DIOS DORADO</div>
</div>

<div class="actions">
<button onclick="alimentar()">🦴 ALIMENTAR</button>
<button onclick="evolucionar()">✨ EVOLUCIONAR</button>
</div>

<div class="stats">
<div class="stat">HAMBRE<b id="hambre">100%</b></div>
<div class="stat">FELICIDAD<b id="felicidad">100%</b></div>
<div class="stat">NIVEL<b id="nivel">7</b></div>
</div>
</div>

<script>
let etapa = parseInt(localStorage.getItem('xolo_etapa') || '7');
const etapas = ["HUEVO","BEBE","CACHORRO","JOVEN","ADULTO","GUERRERO","LEYENDA","DIOS DORADO"];
function updateUI(){
 document.getElementById('etapa-text').innerText = `ETAPA ${etapa}/7 ${etapas[etapa]}`;
 document.getElementById('nivel').innerText = etapa;
}
function alimentar(){
 let h = document.getElementById('hambre'); h.innerText='100%'; h.style.color='#00ff88';
 setTimeout(()=>h.style.color='#ffcc00',500);
}
function evolucionar(){
 if(etapa<7){etapa++; localStorage.setItem('xolo_etapa',etapa); updateUI();}
 else{alert('¡Ya eres un DIOS DORADO! 👑');}
}
updateUI();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
