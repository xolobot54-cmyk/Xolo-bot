<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0a0a0f">
<title>XOLO ANTI-IA V12 FIX</title>
<link rel="manifest" href="manifest.json">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0f;color:#e5e5e5;min-height:100vh;padding:16px;padding-bottom:100px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1e1e2a;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{width:36px;height:36px;border-radius:10px;box-shadow:0 0 15px rgba(168,85,247,.5);background:#000;object-fit:cover}
.logo b{font-size:18px;letter-spacing:1px;color:#fff}
.ver{color:#a855f7;font-size:11px;font-weight:700}
.status{border:1px solid #22c55e;color:#22c55e;background:rgba(34,197,94,.08);padding:10px 14px;border-radius:100px;font-size:12px;font-weight:700;text-align:center;margin-bottom:20px}
.status.alert{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,.15);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.card{background:#12121a;border:1px solid #232334;border-radius:16px;padding:20px;margin-bottom:16px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;transition:opacity .2s}
.btn:active{opacity:.8}
.btn-audio{background:#fff;color:#000}
.btn-audio.rec{background:#ef4444;color:#fff;animation:pulse 1s infinite}
.btn-video{background:#a855f7;color:#fff;margin-top:12px}
.meter{height:12px;background:#1a1a25;border-radius:100px;overflow:hidden;margin:12px 0;display:none}
.meter-fill{height:100%;width:0%;background:linear-gradient(90deg,#22c55e,#eab308,#ef4444);transition:width .3s ease}
.result-box{display:none;padding:16px;border-radius:10px;margin-top:12px;font-size:14px;font-weight:800;text-align:center;line-height:1.4}
.result-box.safe{background:rgba(34,197,94,.1);border:2px solid #22c55e;color:#22c55e}
.result-box.warn{background:rgba(234,179,8,.1);border:2px solid #eab308;color:#eab308}
.result-box.danger{background:rgba(239,68,68,.15);border:2px solid #ef4444;color:#ef4444;font-size:20px}
.inp{background:#0a0a0f;border:1px solid #232334;border-radius:10px;padding:12px;color:#fff;width:100%;font-size:13px}
#xolo-bubble{
position:fixed;
bottom:24px;
right:20px;
width:62px;
height:62px;
border-radius:50%;
background:#0a0a0f;
border:2px solid #a855f7;
box-shadow:0 0 20px rgba(168,85,247,.7);
z-index:9999;
cursor:grab;
touch-action:none;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
color:#fff;
transition:transform .08s ease,box-shadow .08s ease;
}
.xolo-core{
width:52px;
height:52px;
border-radius:50%;
background:#0a0a0f url('icon-512.png') center/cover no-repeat;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
color:#fff;
z-index:4;
}
.xolo-ring{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
border-radius:50%;
border:1px solid #a855f7;
pointer-events:none;
opacity:.35;
z-index:3;
}
.ring1{width:70px;height:70px;border-color:red;}
.ring2{width:82px;height:82px;opacity:.22;}
.ring3{width:96px;height:96px;opacity:.12;}
canvas{width:100%;height:60px;background:#0a0a0f;border-radius:8px;margin-top:10px;display:none}
</style>
</head>
<body>
<header>
<div class="logo"><img src="icon-512.png" alt="Logo Xolo"><b>XOLO ANTI-IA</b></div>
<div class="ver">V12 FIX REAL</div>
</header>
<div id="status" class="status">● PROTECCIÓN ACTIVA - MOTOR LOCAL</div>

<div class="card">
<h2>🎙️ Análisis de Llamada en Vivo</h2>
<p>Detecta voces artificiales: falta de imperfecciones, variación y respiración natural.</p>
<button id="btnAudio" class="btn btn-audio" onclick="toggleAudio()">INICIAR ANÁLISIS DE AUDIO</button>
<canvas id="wave" width="600" height="60"></canvas>
<div id="meter" class="meter"><div id="fill" class="meter-fill"></div></div>
<div id="resAudio" class="result-box"></div>
<div id="stats" style="font-size:11px;color:#6b7280;margin-top:8px;display:none"></div>
</div>

<div class="card">
<h2>🎬 Análisis de Video</h2>
<input type="file" id="v" accept="video/*" style="width:100%;background:#0a0a0f;border:1px dashed #2a2a3a;color:#6b7280;padding:12px;border-radius:10px;font-size:12px">
<button class="btn btn-video" onclick="analizarVideoReal()">ANALIZAR VIDEO</button>
<div id="resVideo" class="result-box"></div>
<video id="preview" style="width:100%;margin-top:12px;border-radius:10px;display:none" muted></video>
<canvas id="c" style="display:none;width:320px;height:240px"></canvas>
</div>

<div id="xolo-bubble">
  <div class="xolo-core"></div>
  <div class="xolo-ring ring1"></div>
  <div class="xolo-ring ring2"></div>
  <div class="xolo-ring ring3"></div>
</div>

<script>
// Burbuja arrastrable
const b=document.getElementById('xolo-bubble');
let isD=false,sx,sy,ox=0,oy=0;
b.addEventListener('touchstart',e=>{
  isD=true;
  sx=e.touches[0].clientX;
  sy=e.touches[0].clientY;
  const r=b.getBoundingClientRect();
  ox=r.left;
  oy=r.top;
  b.style.left=ox+'px';
  b.style.top=oy+'px';
  b.style.right='auto';
  b.style.bottom='auto';
},{passive:false});

b.addEventListener('touchmove',e=>{
  if(!isD)return;
  e.preventDefault();
  let nx=ox+e.touches[0].clientX-sx;
  let ny=oy+e.touches[0].clientY-sy;
  if(nx<0)nx=0;
  if(ny<0)ny=0;
  b.style.left=nx+'px';
  b.style.top=ny+'px';
},{passive:false});

b.addEventListener('touchend',()=>{isD=false;});

// Soporte para ratón
let dragging=false,mx,my,px,py;
b.addEventListener('mousedown',e=>{
  dragging=true;
  mx=e.clientX; my=e.clientY;
  px=parseInt(b.style.left)||0;
  py=parseInt(b.style.top)||0;
});
document.addEventListener('mousemove',e=>{
  if(!dragging)return;
  e.preventDefault();
  const dx=e.clientX-mx;
  const dy=e.clientY-my;
  b.style.left=Math.max(0,px+dx)+'px';
  b.style.top=Math.max(0,py+dy)+'px';
});
document.addEventListener('mouseup',()=>{dragging=false;});

// === ANÁLISIS DE AUDIO ===
let audioCtx,analyser,mic,raf,isRec=false,fakeScoreHistory=[];
const btnAudio=document.getElementById('btnAudio'),
      meter=document.getElementById('meter'),
      fill=document.getElementById('fill'),
      resAudio=document.getElementById('resAudio'),
      statusEl=document.getElementById('status'),
      waveCanvas=document.getElementById('wave'),
      waveCtx=waveCanvas.getContext('2d'),
      statsEl=document.getElementById('stats');

async function toggleAudio(){
  if(!isRec) iniciarAudioReal();
  else detenerAudio();
}

async function iniciarAudioReal(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}
    });
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    analyser.smoothingTimeConstant=0.6;
    mic=audioCtx.createMediaStreamSource(stream);
    mic.connect(analyser);
    isRec=true;
    btnAudio.textContent='DETENER ANÁLISIS';
    btnAudio.classList.add('rec');
    meter.style.display='block';
    waveCanvas.style.display='block';
    statsEl.style.display='block';
    resAudio.style.display='none';
    fakeScoreHistory=[];
    statusEl.className='status';
    statusEl.textContent='● ANALIZANDO AUDIO...';
    analyzeLoop();
  }catch(e){
    alert('Permiso micrófono: '+e.message);
  }
}

function detenerAudio(){
  isRec=false;
  cancelAnimationFrame(raf);
  if(audioCtx) audioCtx.close();
  btnAudio.textContent='INICIAR ANÁLISIS DE AUDIO';
  btnAudio.classList.remove('rec');
  meter.style.display='none';
  waveCanvas.style.display='none';
  statusEl.className='status';
  statusEl.textContent='● PROTECCIÓN ACTIVA - MOTOR LOCAL';
}

function analyzeLoop(){
  const data=new Uint8Array(analyser.fftSize);
  const freq=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteTimeDomainData(data);
  analyser.getByteFrequencyData(freq);

  // Dibujar onda
  waveCtx.clearRect(0,0,waveCanvas.width,waveCanvas.height);
  waveCtx.beginPath();
  waveCtx.strokeStyle='#a855f7';
  waveCtx.lineWidth=2;
  for(let i=0;i<data.length;i++){
    const x=i/data.length*waveCanvas.width;
    const y=data[i]/128*waveCanvas.height/2;
    if(i===0) waveCtx.moveTo(x,y);
    else waveCtx.lineTo(x,y);
  }
  waveCtx.stroke();

  // Cálculos de detección
  let zeroCross=0;
  for(let i=1;i<data.length;i++){
    if((data[i-1]>128)!=(data[i]>128)) zeroCross++;
  }
  const energy=data.reduce((s,v)=>s+Math.abs(v-128),0)/data.length;
  const highFreq=freq.slice(freq.length/2).reduce((a,b)=>a+b,0)/(freq.length/2);
  const lowFreq=freq.slice(0,freq.length/4).reduce((a,b)=>a+b,0)/(freq.length/4);
  const spectralFlatness=highFreq/(lowFreq+1);

  // Puntuación ajustada
  let fakeScore=0;
  if(energy>6 && energy<16) fakeScore+=30;
  else if(energy>4 && energy<20) fakeScore+=15;

  if(zeroCross<350) fakeScore+=20;
  else if(zeroCross<450) fakeScore+=10;

  if(spectralFlatness>0.45) fakeScore+=35;
  else if(spectralFlatness>0.3) fakeScore+=15;

  // Variabilidad: voces humanas cambian más entre sí
  const recent=fakeScoreHistory.slice(-10);
  const variance=recent.length>1 ?
    Math.sqrt(recent.reduce((a,b)=>a+(b-(recent.reduce((p,q)=>p+q,0)/recent.length))**2,0)/(recent.length-1)) : 0;
  if(variance<6) fakeScore+=15; // muy estable = sospechoso

  fakeScore=Math.max(0,Math.min(100,fakeScore));
  fakeScoreHistory.push(fakeScore);
  if(fakeScoreHistory.length>25) fakeScoreHistory.shift();

  const avgScore=Math.round(fakeScoreHistory.reduce((a,b)=>a+b,0)/fakeScoreHistory.length);
  fill.style.width=avgScore+'%';
  statsEl.textContent=`Energía: ${energy.toFixed(1)} | Cruces: ${zeroCross} | Planitud: ${spectralFlatness.toFixed(2)} | Variación: ${variance.toFixed(1)} | Riesgo: ${avgScore}%`;

  // Resultado
  if(avgScore>75){
    resAudio.className='result-box danger';
    resAudio.style.display='block';
    resAudio.innerHTML='🚨 ALERTA: Voz con alta probabilidad de IA ('+avgScore+'%)';
    statusEl.className='status alert';
    statusEl.textContent='⚠️ POSIBLE FRAUDE POR VOZ IA';
    if(avgScore>85 && navigator.vibrate) navigator.vibrate([200,100,200]);
  } else if(avgScore>45){
    resAudio.className='result-box warn';
    resAudio.style.display='block';
    resAudio.innerHTML='⚠️ SOSPECHOSO: '+avgScore+'% IA. Verifica la identidad.';
    statusEl.className='status alert';
    statusEl.textContent='⚠️ SEÑALES SOSPECHOSAS';
  } else {
    resAudio.className='result-box safe';
    resAudio.style.display='block';
    resAudio.innerHTML='✅ VOZ HUMANA CONFIRMADA: '+(100-avgScore)+'% natural';
    statusEl.className='status';
    statusEl.textContent='● PROTECCIÓN ACTIVA - HUMANO DETECTADO';
  }

  if(isRec) raf=requestAnimationFrame(analyzeLoop);
}

// === ANÁLISIS DE VIDEO ===
async function analizarVideoReal(){
  const file=document.getElementById('v').files[0];
  const res=document.getElementById('resVideo');
  const preview=document.getElementById('preview');
  const canvas=document.getElementById('c');
  const ctx=canvas.getContext('2d');

  if(!file){alert('Primero selecciona un video');return;}

  res.style.display='block';
  res.className='result-box warn';
  res.innerHTML='🔍 Cargando video...';
  statusEl.className='status';
  statusEl.textContent='● Analizando video...';

  preview.src=URL.createObjectURL(file);
  preview.style.display='block';

  await new Promise((resolve,reject)=>{
    preview.onloadedmetadata=resolve;
    preview.onerror=()=>reject('No se pudo cargar el video');
  });

  canvas.width=320;
  canvas.height=240;

  // Analizar varios fotogramas para mayor precisión
  const framesToCheck=5;
  let totalPink=0, totalNeon=0, totalEdges=0;

  for(let f=0;f<framesToCheck;f++){
    const timePoint=0.2 + (f * 0.1);
    preview.currentTime=Math.min(timePoint, preview.duration * 0.3);
    await new Promise(r=>{preview.onseeked=r;});
    await new Promise(r=>setTimeout(r,80));

    ctx.drawImage(preview,0,0,canvas.width,canvas.height);
    const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
    const d=imgData.data;

    let pink=0, neon=0;
    let edgeScore=0;
    let prevGray;

    for(let i=0;i<d.length;i+=4){
      const r=d[i], g=d[i+1], b=d[i+2];
      const gray=Math.round((r*0.299)+(g*0.587)+(b*0.114));

      // Tonos rosas/magenta típicos de IA
      if(r>170 && g<110 && b>130 && r>b*0.85) pink++;
      if(r>190 && g<140 && b>140 && Math.abs(r-b)<60) neon++;

      // Bordes: videos reales tienen más detalle
      if(prevGray!==undefined){
        edgeScore+=Math.abs(gray-prevGray);
      }
      prevGray=gray;
    }
    totalPink+=pink;
    totalNeon+=neon;
    totalEdges+=edgeScore/(canvas.width*canvas.height);
  }

  const avgPink=totalPink/framesToCheck;
  const avgNeon=totalNeon/framesToCheck;
  const avgEdge=totalEdges/framesToCheck;

  // Cálculo de porcentaje IA
  let score=0;
  if(avgPink>200) score+=40;
  else if(avgPink>80) score+=20;

  if(avgNeon>150) score+=35;
  else if(avgNeon>60) score+=15;

  if(avgEdge<12) score+=25; // muy suave = probable IA
  else if(avgEdge<18) score+=10;

  const porc=Math.min(98, Math.round(score));

  // Resultado final
  if(porc>=55){
    res.className='result-box danger';
    res.innerHTML=`🚨 VIDEO GENERADO POR IA<br><br>${porc}%<br><small style="font-size:12px">Patrones y colores artificiales detectados</small>`;
    statusEl.className='status alert';
    statusEl.textContent='🚨 IA DETECTADA: '+porc+'%';
    if(navigator.vibrate) navigator.vibrate([200,150,200,150,200]);
  } else if(porc>=35){
    res.className='result-box warn';
    res.innerHTML=`⚠️ CONTENIDO SOSPECHOSO<br><br>${porc}% IA<br><small style="font-size:12px">Revisa con atención</small>`;
    statusEl.className='status alert';
    statusEl.textContent='⚠️ SOSPECHOSO: '+porc+'% IA';
  } else {
    res.className='result-box safe';
    res.innerHTML=`✅ VIDEO REAL<br><br>${100-porc}% VERIFICADO`;
    statusEl.className='status';
    statusEl.textContent='● VIDEO VERIFICADO COMO REAL';
  }
}

// Registrar Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js')
    .catch(()=>{/* sin error si no existe sw.js */});
}
</script>
</body>
</html>
